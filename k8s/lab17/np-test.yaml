apiVersion: v1
kind: Pod
metadata:
  name: np-test
  namespace: ivolve
  labels:
    app: other
spec:
  nodeSelector:
    project: ivolve
  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "ivolveApp"
      effect: "NoSchedule"
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
