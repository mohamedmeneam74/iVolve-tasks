apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivolveapp
  namespace: ivolve
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0           
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ivolveapp
  template:
    metadata:
      labels:
        app: ivolveapp
    spec:
      nodeSelector:
        project: ivolve
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "ivolveApp"
          effect: "NoSchedule"
      initContainers:
        - name: init-db
          image: mysql:8.0               
          envFrom:
            - configMapRef:
                name: ivolvecm             # DB_HOST, DB_USER
            - secretRef:
                name: ivolvesecret         # MYSQL_ROOT_PASSWORD, DB_PASSWORD
          command: ["sh", "-c"]
          args:
            - |
              until mysqladmin ping -h "$DB_HOST" -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; do
                echo "waiting for MySQL..."; sleep 3
              done
              mysql -h "$DB_HOST" -uroot -p"$MYSQL_ROOT_PASSWORD" <<SQL
              CREATE DATABASE IF NOT EXISTS ivolve;
              CREATE USER IF NOT EXISTS '$DB_USER'@'%' IDENTIFIED BY '$DB_PASSWORD';
              GRANT ALL PRIVILEGES ON ivolve.* TO '$DB_USER'@'%';
              FLUSH PRIVILEGES;
              SQL
      containers:
        - name: app
          image: medomeneam/ivolve-app:v1     
          ports:
            - containerPort: 3000             
          envFrom:
            - configMapRef:
                name: ivolvecm
            - secretRef:
                name: ivolvesecret
          env:
            - name: DB_NAME                   
              value: ivolve
          volumeMounts:
            - name: logs
              mountPath: /app/logs            
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: ivolvepvc



