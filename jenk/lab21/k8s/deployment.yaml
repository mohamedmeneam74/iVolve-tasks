apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapp
  namespace: ivolve
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: demoapp
  template:
    metadata:
      labels:
        app: demoapp
    spec:
      nodeSelector:
        project: ivolve
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "ivolveApp"
          effect: "NoSchedule"
      containers:
        - name: demoapp
          image: medomeneam/demoapp:latest     
          ports:
            - containerPort: 8080
